name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up SDK and Install Android Platform
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34"

      # Secrets aren't available to pull requests from forks; those get an
      # unsigned APK instead.
      - name: Decode Android Keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          echo "KEYSTORE_FILE=release.keystore" >> "$GITHUB_ENV"

      - name: Build APK with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Clean up Keystore
        if: always()
        run: rm -f app/release.keystore

      - name: Rename APK
        run: |
          cd app/build/outputs/apk/release
          for f in app-release.apk app-release-unsigned.apk; do
            if [ -f "$f" ]; then mv "$f" save-to-files.apk; fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: save-to-files-android
          path: app/build/outputs/apk/release/save-to-files.apk
          retention-days: 1

  release:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android]
    if: github.event_name == 'workflow_dispatch'

    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v6

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Extract Version and Generate Checksum
        run: |
          VERSION=$(grep -m 1 'versionName = ' app/build.gradle.kts | awk -F '"' '{print $2}')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

          APK_SHA=$(sha256sum release-artifacts/save-to-files.apk | awk '{print $1}')

          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "Save to files v$VERSION" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "### Checksums" >> $GITHUB_ENV
          echo "| Variant | SHA-256 |" >> $GITHUB_ENV
          echo "| ------- | ------- |" >> $GITHUB_ENV
          echo "| Android | $APK_SHA |" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Publish Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: v${{ env.APP_VERSION }}
          body: ${{ env.RELEASE_BODY }}
          draft: true
          files: release-artifacts/save-to-files.apk

      - name: Delete Artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: save-to-files-*
